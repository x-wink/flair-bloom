# flair-bloom 产品页在 app.xwink.fun 下的路由片段。
# 服务器落点：/etc/nginx/vhost.d/app.xwink.fun/flair-bloom.conf（app.xwink.fun 的 server 块 include 该目录）。
# 由本仓 site-v* 发布链下发，下发后先 nginx -t 再 reload，失败回滚。

location = /flair-bloom {
    return 301 /flair-bloom/;
}

# 站点产物走 root + 软链而不是 alias：alias 与 try_files 组合有已知缺陷，目录回落会找错文件。
# /opt/flair-bloom/www/flair-bloom 是指向当前版本产物的软链，切版本即换软链。
location /flair-bloom/ {
    root /opt/flair-bloom/www;
    try_files $uri $uri/index.html $uri.html =404;
}

location /flair-bloom/_nuxt/ {
    root /opt/flair-bloom/www;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
