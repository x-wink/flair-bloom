name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新构建/发布的已有版本 tag（vX.Y.Z）'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/main/src-tauri -> target

      - name: Install dependencies
        run: pnpm install

      # 前端纯函数断言（含 macOS 12 WebKit 白屏护栏），CI 只装 Rust 不覆盖，发版前在这里拦
      - name: Frontend unit tests
        run: pnpm test:ui

      - name: Check packaged driver resources
        run: pnpm check:resources

      - name: Resolve previous release tag
        id: prev_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 30 \
            --json tagName --jq "[.[] | select(.tagName != \"$CURRENT_TAG\")][0].tagName // \"\"")
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "上一次稳定发布：${prev:-<无>}"

      - name: Extract changelog
        id: changelog
        shell: bash
        run: pnpm exec tsx scripts/extract-changelog.ts "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" "${{ steps.prev_release.outputs.tag }}"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 未配置的 secret 展开成空串，crypto 的 build script 会让构建失败而不是发出验不了许可证的版本
          FLAIR_LICENSE_PUBKEYS: ${{ secrets.FLAIR_LICENSE_PUBKEYS }}
        with:
          projectPath: apps/main
          assetNamePattern: 'FlairBloom_[version]_[arch][setup][ext]'
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: 气质花按键助手 FlairBloom ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Check release assets and updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:release "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
